<!DOCTYPE html>
<html lang="om">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LMS & Exam Portal</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-50 font-sans text-slate-800">

    <!-- 1. LOGIN & REGISTER CONTAINER -->
    <div id="auth-container" class="min-h-screen flex items-center justify-center px-4">
        <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-8 border border-slate-100">
            <div class="text-center mb-8">
                <div class="w-16 h-16 bg-indigo-600 rounded-2xl flex items-center justify-center mx-auto mb-4 text-white text-2xl shadow-lg shadow-indigo-200">
                    <i class="fa-solid fa-graduation-cap"></i>
                </div>
                <h2 class="text-2xl font-bold text-slate-900">Baga Nagaan Dhuftan!</h2>
                <p class="text-slate-500 mt-2">Maaloo seenuuf galmee keessan galchaa</p>
            </div>

            <!-- Login Form -->
            <form id="login-form" class="space-y-5">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-2">Email Teessoo</label>
                    <input type="email" id="login-email" required class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="fkn: barataa@gmail.com">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-2">Password</label>
                    <input type="password" id="login-password" required class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="••••••••">
                </div>
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-xl shadow-lg shadow-indigo-100 transition duration-200">Seeni (Login)</button>
            </form>

            <!-- Toggle Register -->
            <p class="text-center text-sm text-slate-500 mt-6">
                Account hin qabduu? <button id="to-register" class="text-indigo-600 font-bold hover:underline">Ammuma Galmaa'i</button>
            </p>
        </div>
    </div>

    <!-- 2. STUDENT PORTAL (Dashboard) -->
    <div id="app-container" class="hidden min-h-screen flex flex-col">
        <!-- Header -->
        <header class="bg-white border-b border-slate-100 sticky top-0 z-50">
            <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center text-white text-lg font-bold">
                        <i class="fa-solid fa-book-open"></i>
                    </div>
                    <span class="font-bold text-slate-900 text-lg">LMS Portal</span>
                </div>
                <div class="flex items-center gap-4">
                    <span id="user-display" class="text-sm font-semibold text-slate-600">...</span>
                    <button id="btn-admin-portal" class="hidden bg-slate-900 text-white text-xs font-bold px-3 py-2 rounded-lg hover:bg-slate-800"><i class="fa-solid fa-lock-open mr-1"></i> Admin Panel</button>
                    <button id="btn-logout" class="text-rose-600 hover:bg-rose-50 p-2 rounded-lg transition"><i class="fa-solid fa-right-from-bracket"></i></button>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="flex-1 max-w-7xl w-full mx-auto px-4 py-8">
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                <!-- Lessons List -->
                <div class="lg:col-span-2 space-y-6">
                    <h3 class="text-xl font-bold text-slate-900 flex items-center gap-2"><i class="fa-solid fa-graduation-cap text-indigo-600"></i> Barnoota jiran</h3>
                    <div id="lessons-list" class="grid grid-cols-1 gap-4">
                        <!-- Lessons dynamically load here -->
                    </div>
                </div>

                <!-- Exams List -->
                <div class="space-y-6">
                    <h3 class="text-xl font-bold text-slate-900 flex items-center gap-2"><i class="fa-solid fa-file-signature text-emerald-600"></i> Qormaata</h3>
                    <div id="exams-list" class="space-y-4">
                        <!-- Exams dynamically load here -->
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- SUPABASE CLIENT CONFIG -->
    <script>
        const SUPABASE_URL = "https://zxljzdhuilhzcdbgrxol.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_WKWwxJeXUi0bbgN4NsD3nQ_w1Xwdjhs";
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const authContainer = document.getElementById('auth-container');
        const appContainer = document.getElementById('app-container');
        const loginForm = document.getElementById('login-form');
        const userDisplay = document.getElementById('user-display');
        const btnAdminPortal = document.getElementById('btn-admin-portal');
        const btnLogout = document.getElementById('btn-logout');

        // Check Auth on Load
        window.addEventListener('DOMContentLoaded', async () => {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                showApp(session.user);
            }
        });

        // Login Handler
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            const { data, error } = await supabase.auth.signInWithPassword({ email, password });
            if (error) {
                alert("Error Login: " + error.message);
            } else {
                showApp(data.user);
            }
        });

        // Logout Handler
        btnLogout.addEventListener('click', async () => {
            await supabase.auth.signOut();
            authContainer.classList.remove('hidden');
            appContainer.classList.add('hidden');
        });

        async function showApp(user) {
            authContainer.classList.add('hidden');
            appContainer.classList.remove('hidden');
            userDisplay.textContent = user.email;

            // Role Check
            const { data: profile } = await supabase.from('profiles').select('role').eq('id', user.id).single();
            if (profile && (profile.role === 'admin' || profile.role === 'owner')) {
                btnAdminPortal.classList.remove('hidden');
                btnAdminPortal.addEventListener('click', () => {
                    window.location.href = '/admin';
                });
            }

            loadLessons();
            loadExams();
        }

        async function loadLessons() {
            const list = document.getElementById('lessons-list');
            list.innerHTML = `<div class="text-slate-500">Loading lessons...</div>`;

            const { data: lessons, error } = await supabase.from('lessons').select('*').eq('is_published', true);
            if (error) {
                list.innerHTML = `<div class="text-rose-500">Error: ${error.message}</div>`;
                return;
            }

            if (lessons.length === 0) {
                list.innerHTML = `<div class="text-slate-500">Barnoonni haaraan ammaaf hin jiru.</div>`;
                return;
            }

            list.innerHTML = lessons.map(l => `
                <div class="bg-white rounded-xl p-5 border border-slate-100 shadow-sm hover:shadow-md transition">
                    <h4 class="text-lg font-bold text-slate-900">${l.title}</h4>
                    <p class="text-slate-500 text-sm mt-1">${l.description || 'Ibsa hin qabu'}</p>
                    <button class="mt-4 bg-indigo-50 text-indigo-600 hover:bg-indigo-100 px-4 py-2 rounded-lg text-sm font-bold transition">Barnoota Bani</button>
                </div>
            `).join('');
        }

        async function loadExams() {
            const list = document.getElementById('exams-list');
            list.innerHTML = `<div class="text-slate-500">Loading exams...</div>`;

            const { data: exams, error } = await supabase.from('exams').select('*').eq('is_published', true);
            if (error) {
                list.innerHTML = `<div class="text-rose-500">Error: ${error.message}</div>`;
                return;
            }

            if (exams.length === 0) {
                list.innerHTML = `<div class="text-slate-500">Qormaanni haaraan ammaaf hin jiru.</div>`;
                return;
            }

            list.innerHTML = exams.map(e => `
                <div class="bg-white rounded-xl p-5 border border-slate-100 shadow-sm">
                    <h4 class="font-bold text-slate-900">${e.title}</h4>
                    <p class="text-xs text-slate-400 mt-1"><i class="fa-solid fa-clock"></i> ${e.duration_minutes} Mins</p>
                    <button class="w-full mt-4 bg-emerald-600 hover:bg-emerald-700 text-white py-2 rounded-lg text-sm font-bold transition">Qormaata Jalqabi</button>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
