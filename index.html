<!DOCTYPE html>
<html lang="om">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sirna Qormaata Barattootaa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-[#0f172a] text-slate-800 font-sans min-h-screen">

    <!-- 1. STUDENT LOGIN & REGISTER BOX -->
    <div id="auth-box" class="min-h-screen flex items-center justify-center px-4 py-8">
        <div class="max-w-md w-full bg-white rounded-3xl p-8 shadow-2xl border border-slate-100">
            <div class="text-center mb-6">
                <div class="w-16 h-16 bg-indigo-600 rounded-2xl flex items-center justify-center mx-auto mb-3 text-white text-2xl shadow-lg shadow-indigo-200">
                    <i class="fa-solid fa-file-pen"></i>
                </div>
                <h2 class="text-2xl font-bold text-slate-900">Sirna Qormaataa</h2>
                <p class="text-slate-500 text-sm mt-1">Seensa Barataa (Student Login)</p>
            </div>

            <!-- Login with ID -->
            <div id="login-section" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Student ID Kee Galchi</label>
                    <input type="text" id="input-student-id" placeholder="fkn: STU-1234" class="w-full px-4 py-3 uppercase font-mono font-bold border-2 border-slate-200 rounded-xl focus:border-indigo-600 outline-none">
                </div>
                <button type="button" id="btn-login" class="w-full bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white font-bold py-3 rounded-xl shadow-lg shadow-indigo-100 transition cursor-pointer">Seeni (Login)</button>
                <div class="text-center pt-2">
                    <button type="button" id="btn-to-register" class="text-xs text-indigo-600 font-bold hover:underline cursor-pointer">ID Hin Qabduu? Har'a Galmaa'i</button>
                </div>
            </div>

            <!-- Register New Student -->
            <div id="register-section" class="hidden space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Maqaa Guutuu</label>
                    <input type="text" id="reg-name" placeholder="Maqaa kee" class="w-full px-4 py-3 border rounded-xl outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Lakk. Bilbilaa</label>
                    <input type="tel" id="reg-phone" placeholder="09..." class="w-full px-4 py-3 border rounded-xl outline-none">
                </div>
                <button type="button" id="btn-register" class="w-full bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 text-white font-bold py-3 rounded-xl shadow-lg shadow-emerald-100 transition cursor-pointer">Galmaa'i & ID Fudhadhu</button>
                <div class="text-center pt-2">
                    <button type="button" id="btn-to-login" class="text-xs text-slate-500 font-bold hover:underline cursor-pointer">Duraanuu Galmoofteetta? Seeni</button>
                </div>
            </div>
            
            <div class="text-center mt-6 border-t pt-4">
                <a href="/admin" class="text-xs text-slate-400 hover:text-slate-600 font-semibold"><i class="fa-solid fa-lock mr-1"></i> Seensa Admin</a>
            </div>
        </div>
    </div>

    <!-- 2. STUDENT DASHBOARD -->
    <div id="student-dashboard" class="hidden min-h-screen bg-slate-50 flex flex-col">
        <header class="bg-slate-900 text-white h-16 flex items-center justify-between px-6">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-graduation-cap text-indigo-400 text-xl"></i>
                <div>
                    <h3 id="dash-student-name" class="font-bold text-sm">...</h3>
                    <p id="dash-student-id" class="text-[10px] text-indigo-300 font-mono">...</p>
                </div>
            </div>
            <button type="button" id="btn-logout-student" class="text-rose-400 hover:text-rose-300 text-sm font-bold cursor-pointer"><i class="fa-solid fa-right-from-bracket"></i> Ba'i</button>
        </header>

        <main class="max-w-4xl w-full mx-auto p-6 space-y-6 flex-1">
            <div class="bg-white p-6 rounded-2xl border shadow-sm space-y-4">
                <h3 class="font-bold text-slate-900 text-lg flex items-center gap-2"><i class="fa-solid fa-clipboard-list text-indigo-600"></i> Qormaata Jiran</h3>
                <div id="exams-list" class="space-y-3"></div>
            </div>

            <div class="bg-white p-6 rounded-2xl border shadow-sm space-y-4">
                <h3 class="font-bold text-slate-900 text-lg flex items-center gap-2"><i class="fa-solid fa-chart-simple text-emerald-600"></i> Seenaa Qabxii Koo</h3>
                <div id="my-results-list" class="space-y-2"></div>
            </div>
        </main>
    </div>

    <!-- 3. ACTIVE EXAM SCREEN -->
    <div id="exam-screen" class="hidden min-h-screen bg-slate-100 flex items-center justify-center p-4">
        <div class="max-w-3xl w-full bg-white rounded-3xl p-6 sm:p-8 shadow-xl border space-y-6">
            <div class="flex justify-between items-center border-b pb-4">
                <h2 id="exam-title-display" class="font-bold text-lg text-slate-900">...</h2>
                <div class="bg-rose-50 border border-rose-200 text-rose-600 px-4 py-2 rounded-xl font-bold font-mono text-sm">
                    <i class="fa-solid fa-clock mr-1"></i> <span id="timer-display">00:00</span>
                </div>
            </div>

            <div id="questions-container" class="space-y-6 max-h-[60vh] overflow-y-auto pr-2"></div>

            <div class="flex justify-end border-t pt-4">
                <button type="button" id="btn-submit-exam" class="bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 text-white font-bold px-8 py-3 rounded-xl transition shadow-lg shadow-emerald-100 cursor-pointer">Qormaata Xumuri</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://zxljzdhuilhzcdbgrxol.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_WKWwxJeXUi0bbgN4NsD3nQ_w1Xwdjhs";
        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentStudent = null;
        let activeExamId = null;
        let activeQuestions = [];
        let answers = {};
        let examTimer = null;

        document.getElementById('btn-to-register').addEventListener('click', () => {
            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('register-section').classList.remove('hidden');
        });

        document.getElementById('btn-to-login').addEventListener('click', () => {
            document.getElementById('register-section').classList.add('hidden');
            document.getElementById('login-section').classList.remove('hidden');
        });

        document.getElementById('btn-register').addEventListener('click', async () => {
            const name = document.getElementById('reg-name').value.trim();
            const phone = document.getElementById('reg-phone').value.trim();
            if (!name || !phone) return alert("Maaloo maqaa fi lakk. bilbilaa galchi!");

            const newId = "STU-" + Math.floor(1000 + Math.random() * 9000);
            const { error } = await db.from('exam_students').insert([{ id: newId, full_name: name, phone: phone }]);
            if (error) return alert("Error: " + error.message);

            alert("🎉 Galmeen milkaa'eera!\n\nSTUDENT ID KEE: " + newId + "\n(ID kana bakka gaariitti qabadhu!)");
            document.getElementById('input-student-id').value = newId;
            document.getElementById('register-section').classList.add('hidden');
            document.getElementById('login-section').classList.remove('hidden');
        });

        document.getElementById('btn-login').addEventListener('click', async () => {
            const id = document.getElementById('input-student-id').value.trim().toUpperCase();
            if (!id) return alert("Maaloo Student ID galchi!");

            const { data: student, error } = await db.from('exam_students').select('*').eq('id', id).single();
            if (error || !student) return alert("Student ID kun hin argamne! Maaloo dura galmaa'aa.");
            if (!student.is_allowed) return alert("Dhiifama, Admin-ni seensa kee dhowweera (Blocked)!");

            currentStudent = student;
            localStorage.setItem('student_id', student.id);
            openDashboard();
        });

        window.addEventListener('DOMContentLoaded', () => {
            const savedId = localStorage.getItem('student_id');
            if (savedId) {
                document.getElementById('input-student-id').value = savedId;
                document.getElementById('btn-login').click();
            }
        });

        function openDashboard() {
            document.getElementById('auth-box').classList.add('hidden');
            document.getElementById('student-dashboard').classList.remove('hidden');
            document.getElementById('dash-student-name').textContent = currentStudent.full_name;
            document.getElementById('dash-student-id').textContent = "ID: " + currentStudent.id;
            loadExams();
            loadMyResults();
        }

        document.getElementById('btn-logout-student').addEventListener('click', () => {
            localStorage.removeItem('student_id');
            window.location.reload();
        });

        async function loadExams() {
            const list = document.getElementById('exams-list');
            const { data: exams } = await db.from('exam_tests').select('*').eq('is_active', true);
            if (exams && exams.length > 0) {
                list.innerHTML = exams.map(e => `
                    <div class="flex items-center justify-between p-4 border rounded-2xl hover:border-indigo-200 bg-slate-50 transition">
                        <div>
                            <h4 class="font-bold text-slate-900">${e.title}</h4>
                            <p class="text-xs text-slate-500 mt-1"><i class="fa-solid fa-clock"></i> ${e.duration_minutes} Mins</p>
                        </div>
                        <button onclick="startExam('${e.id}', '${encodeURIComponent(e.title)}', ${e.duration_minutes})" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-4 py-2 rounded-xl text-sm transition cursor-pointer">Qormaata Fudhadhu</button>
                    </div>
                `).join('');
            } else {
                list.innerHTML = `<p class="text-slate-400 text-sm">Qormaanni yeroo ammaa banaa ta'e hin jiru.</p>`;
            }
        }

        async function loadMyResults() {
            const list = document.getElementById('my-results-list');
            const { data: res } = await db.from('exam_results').select('*, exam_tests(title)').eq('student_id', currentStudent.id).order('completed_at', { ascending: false });
            if (res && res.length > 0) {
                list.innerHTML = res.map(r => `
                    <div class="flex justify-between items-center p-3 border rounded-xl text-sm bg-slate-50">
                        <div>
                            <p class="font-bold text-slate-900">${r.exam_tests?.title || 'Qormaata'}</p>
                            <span class="text-[11px] text-slate-400">${new Date(r.completed_at).toLocaleDateString()}</span>
                        </div>
                        <span class="font-bold text-base ${r.score >= 50 ? 'text-emerald-600' : 'text-rose-600'}">${r.score.toFixed(1)}% (${r.correct_answers}/${r.total_questions})</span>
                    </div>
                `).join('');
            } else {
                list.innerHTML = `<p class="text-slate-400 text-sm">Qabxiin kanaan duraa hin jiru.</p>`;
            }
        }

        window.startExam = async function(examId, titleEncoded, duration) {
            activeExamId = examId;
            answers = {};
            const title = decodeURIComponent(titleEncoded);
            document.getElementById('student-dashboard').classList.add('hidden');
            document.getElementById('exam-screen').classList.remove('hidden');
            document.getElementById('exam-title-display').textContent = title;

            let sec = duration * 60;
            if (examTimer) clearInterval(examTimer);
            examTimer = setInterval(() => {
                let m = Math.floor(sec / 60);
                let s = sec % 60;
                document.getElementById('timer-display').textContent = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
                if (sec <= 0) {
                    clearInterval(examTimer);
                    alert("Yeroon dhumateera!");
                    finishExamSubmit();
                }
                sec--;
            }, 1000);

            const { data: qList } = await db.from('exam_questions').select('*').eq('exam_id', examId);
            activeQuestions = qList || [];
            
            const cont = document.getElementById('questions-container');
            if (activeQuestions.length > 0) {
                cont.innerHTML = activeQuestions.map((q, i) => `
                    <div class="p-5 border rounded-2xl bg-slate-50 space-y-3">
                        <p class="font-bold text-slate-900">${i+1}. ${q.question_text}</p>
                        <div class="grid grid-cols-1 gap-2 text-sm">
                            <label class="p-3 bg-white border rounded-xl flex items-center gap-3 cursor-pointer"><input type="radio" name="q-${q.id}" value="A" onchange="answers['${q.id}']='A'"> <span>A) ${q.option_a}</span></label>
                            <label class="p-3 bg-white border rounded-xl flex items-center gap-3 cursor-pointer"><input type="radio" name="q-${q.id}" value="B" onchange="answers['${q.id}']='B'"> <span>B) ${q.option_b}</span></label>
                            <label class="p-3 bg-white border rounded-xl flex items-center gap-3 cursor-pointer"><input type="radio" name="q-${q.id}" value="C" onchange="answers['${q.id}']='C'"> <span>C) ${q.option_c}</span></label>
                            <label class="p-3 bg-white border rounded-xl flex items-center gap-3 cursor-pointer"><input type="radio" name="q-${q.id}" value="D" onchange="answers['${q.id}']='D'"> <span>D) ${q.option_d}</span></label>
                        </div>
                    </div>
                `).join('');
            } else {
                cont.innerHTML = '<p class="text-slate-400">Gaaffiin qormaata kanaa hin argamne.</p>';
            }
        };

        document.getElementById('btn-submit-exam').addEventListener('click', finishExamSubmit);

        async function finishExamSubmit() {
            if (examTimer) clearInterval(examTimer);
            let correct = 0;
            activeQuestions.forEach(q => {
                if (answers[q.id] === q.correct_option) correct++;
            });

            const score = activeQuestions.length > 0 ? (correct / activeQuestions.length) * 100 : 0;
            await db.from('exam_results').insert([{
                student_id: currentStudent.id,
                exam_id: activeExamId,
                student_name: currentStudent.full_name,
                score: score,
                total_questions: activeQuestions.length,
                correct_answers: correct
            }]);

            alert("🎉 QORMAATA XUMURTEETTA!\n\nQabxii Kee: " + score.toFixed(1) + "%\nDeebii Sirrii: " + correct + " / " + activeQuestions.length);
            window.location.reload();
        }
    </script>
</body>
</html>
