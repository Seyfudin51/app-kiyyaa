<!DOCTYPE html>
<html lang="om">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mootummaa Barnootaa - Login</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-[#112240] min-h-screen flex items-center justify-center px-4 font-sans">

    <!-- LOGIN CARD CONTAINER -->
    <div class="max-w-md w-full bg-white rounded-[32px] shadow-2xl p-8 border border-slate-100 text-center">
        
        <!-- Header Text -->
        <h2 class="text-2xl font-bold text-slate-900 mb-1">Seensa / Login</h2>
        <p class="text-slate-500 text-sm mb-8 font-medium">Mootummaa barnootaatti seenuuf filadhaa</p>

        <!-- BUTTONS LIST -->
        <div class="space-y-4">
            
            <!-- 1. Google Login Button -->
            <button id="btn-google" class="w-full py-4 px-6 border-2 border-slate-200 rounded-[20px] flex items-center justify-center gap-3 hover:bg-slate-50 transition duration-200 active:scale-95">
                <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_\"G\"_Logo.svg" class="w-5 h-5" alt="Google">
                <span class="font-bold text-slate-700 text-base">Log in with Google</span>
            </button>

            <!-- 2. Telegram Login Button -->
            <button id="btn-telegram" class="w-full py-4 px-6 bg-[#2fa3d8] hover:bg-[#2892c2] text-white rounded-[20px] flex items-center justify-center gap-3 transition duration-200 active:scale-95 shadow-md shadow-blue-100">
                <i class="fa-brands fa-telegram text-xl"></i>
                <span class="font-bold text-white text-base">Login with Telegram</span>
            </button>

        </div>

    </div>

    <!-- SUPABASE AUTHENTICATION JS -->
    <script>
        const SUPABASE_URL = "https://zxljzdhuilhzcdbgrxol.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_WKWwxJeXUi0bbgN4NsD3nQ_w1Xwdjhs";
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Google Authentication
        document.getElementById('btn-google').addEventListener('click', async () => {
            const { error } = await supabase.auth.signInWithOAuth({
                provider: 'google',
                options: {
                    redirectTo: window.location.origin // Vercel URL keetti deebisa
                }
            });
            if (error) alert("Error: " + error.message);
        });

        // Telegram Authentication (Supabase dhuunfaan OAuth Telegram deeggara)
        document.getElementById('btn-telegram').addEventListener('click', async () => {
            const { error } = await supabase.auth.signInWithOAuth({
                provider: 'telegram',
                options: {
                    redirectTo: window.location.origin
                }
            });
            if (error) alert("Error: " + error.message);
        });

        // Seensa Booda Check gochuu
        supabase.auth.onAuthStateChange((event, session) => {
            if (session) {
                // Yoo milkaa'inaan seene gara fuula barnootaatti (lessons/exams) qajeela
                window.location.href = "/dashboard.html"; // ykn index.html keessatti dashboard agarsiisi
            }
        });
    </script>
</body>
</html>
