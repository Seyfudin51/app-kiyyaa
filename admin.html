<!DOCTYPE html>
<html lang="om">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Kiyya - Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen">

    <!-- ADMIN GOOGLE LOGIN -->
    <div id="admin-auth" class="min-h-screen flex items-center justify-center p-6 primary-gradient">
        <div class="bg-white p-8 rounded-3xl max-w-sm w-full text-center shadow-2xl space-y-4">
            <div class="w-16 h-16 bg-slate-900 text-white rounded-2xl flex items-center justify-center mx-auto text-2xl">
                <i class="fa-solid fa-shield-halved"></i>
            </div>
            <h2 class="text-xl font-black text-slate-900">Admin Seensa</h2>
            <p class="text-slate-400 text-xs">Admin 2 qofatu (seyfudin33 ykn suufiyaanjeeylaanofficial1) seenuu danda'a.</p>

            <button onclick="loginAdminWithGoogle()" class="w-full py-4 border-2 border-slate-200 rounded-2xl flex items-center justify-center gap-3 font-bold text-slate-700 shadow-sm hover:bg-slate-50 cursor-pointer bg-white">
                <img src="https://www.svgrepo.com/show/475656/google-color.svg" class="w-5 h-5"> Login Admin with Google
            </button>
        </div>
    </div>

    <!-- MAIN ADMIN DASHBOARD -->
    <div id="admin-main" class="hidden min-h-screen pb-24">
        <header class="primary-gradient text-white px-6 pt-10 pb-16 rounded-b-[40px] shadow-2xl">
            <div class="flex justify-between items-center mb-4">
                <div class="flex items-center gap-3">
                    <img id="admin-avatar" src="https://ui-avatars.com/api/?name=Admin" class="w-12 h-12 rounded-2xl border-2 border-white/20">
                    <div>
                        <h2 id="admin-name" class="font-black text-lg leading-tight">Admin Portal</h2>
                        <p id="admin-email" class="text-xs text-indigo-200">...</p>
                    </div>
                </div>
                <button onclick="logoutAdmin()" class="bg-white/10 hover:bg-white/20 px-4 py-2 rounded-2xl text-xs font-bold transition cursor-pointer">Ba'i</button>
            </div>
        </header>

        <main class="max-w-6xl w-full mx-auto p-6 grid grid-cols-1 lg:grid-cols-3 gap-8 mt-2">
            
            <!-- LEFT COLUMN -->
            <div class="space-y-6">
                <!-- Create Exam -->
                <div class="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm space-y-3">
                    <h3 class="font-bold text-slate-900 text-sm flex items-center gap-2"><i class="fa-solid fa-folder-plus text-[#1565C0]"></i> Qormaata Haaraa Uumi</h3>
                    <input type="text" id="new-exam-title" placeholder="Mata-duree Qormaataa" class="w-full px-4 py-3 bg-slate-50 border border-slate-100 rounded-xl text-xs outline-none">
                    <input type="number" id="new-exam-duration" placeholder="Yeroo (Daqiiqaa)" class="w-full px-4 py-3 bg-slate-50 border border-slate-100 rounded-xl text-xs outline-none">
                    <button onclick="createExam()" class="w-full bg-[#1565C0] text-white font-bold py-3 rounded-xl text-xs shadow-md cursor-pointer">Uumi (Create)</button>
                </div>

                <!-- Bulk Questions -->
                <div class="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm space-y-3">
                    <h3 class="font-bold text-slate-900 text-sm flex items-center gap-2"><i class="fa-solid fa-paste text-[#2e7d32]"></i> Gaaffilee Hedduu Galchi</h3>
                    <select id="bulk-exam-select" class="w-full px-3 py-3 bg-slate-50 border border-slate-100 rounded-xl text-xs font-bold outline-none"></select>
                    <textarea id="bulk-text" rows="8" placeholder="1. Gaaffii...&#10;A) ...&#10;B) ...&#10;C) ...&#10;D) ...&#10;Deebii: A" class="w-full p-3 bg-slate-50 border border-slate-100 rounded-xl text-xs font-mono outline-none"></textarea>
                    <button onclick="parseAndSaveBulkQuestions()" class="w-full bg-[#2e7d32] text-white font-bold py-3 rounded-xl text-xs shadow-md cursor-pointer">Parse & Save</button>
                </div>

                <!-- Post Notice -->
                <div class="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm space-y-3">
                    <h3 class="font-bold text-slate-900 text-sm flex items-center gap-2"><i class="fa-solid fa-bullhorn text-[#ef6c00]"></i> Beeksisaa Maxxansi</h3>
                    <input type="text" id="notice-title" placeholder="Mata-duree Beeksisaa" class="w-full px-4 py-3 bg-slate-50 border border-slate-100 rounded-xl text-xs outline-none">
                    <textarea id="notice-msg" rows="3" placeholder="Ergaa..." class="w-full p-3 bg-slate-50 border border-slate-100 rounded-xl text-xs outline-none"></textarea>
                    <button onclick="postNotice()" class="w-full bg-[#ef6c00] text-white font-bold py-3 rounded-xl text-xs shadow-md cursor-pointer">Maxxansi</button>
                </div>
            </div>

            <!-- RIGHT COLUMN -->
            <div class="lg:col-span-2 space-y-6">
                <div class="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm space-y-4">
                    <h3 class="font-bold text-slate-900 text-sm flex items-center gap-2"><i class="fa-solid fa-list-check text-[#1565C0]"></i> Qormaata Jiran</h3>
                    <div id="exams-admin-list" class="space-y-3 max-h-60 overflow-y-auto"></div>
                </div>

                <div class="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm space-y-4">
                    <h3 class="font-bold text-slate-900 text-sm flex items-center gap-2"><i class="fa-solid fa-trophy text-[#2e7d32]"></i> Qabxii & Sadarkaa</h3>
                    <div id="results-table" class="space-y-2 max-h-60 overflow-y-auto"></div>
                </div>

                <div class="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm space-y-4">
                    <h3 class="font-bold text-slate-900 text-sm flex items-center gap-2"><i class="fa-solid fa-users text-[#1565C0]"></i> Barattoota To'achuu</h3>
                    <div id="students-table" class="space-y-2 max-h-60 overflow-y-auto"></div>
                </div>

                <div class="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm space-y-4">
                    <h3 class="font-bold text-slate-900 text-sm flex items-center gap-2"><i class="fa-solid fa-comment-dots text-[#c2185b]"></i> Kuusaa Yaadaa</h3>
                    <div id="feedbacks-table" class="space-y-2 max-h-60 overflow-y-auto"></div>
                </div>
            </div>

        </main>
    </div>

    <!-- MODAL -->
    <div id="questions-modal" class="hidden fixed inset-0 bg-slate-900/80 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl max-w-2xl w-full p-6 max-h-[80vh] flex flex-col shadow-2xl">
            <div class="flex justify-between items-center border-b pb-3 mb-4">
                <h3 id="modal-exam-title" class="font-bold text-slate-900 text-sm">Gaaffilee</h3>
                <button onclick="closeModal()" class="text-rose-500 font-bold text-base cursor-pointer"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div id="modal-questions-list" class="flex-1 overflow-y-auto space-y-3 pr-2"></div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://zxljzdhuilhzcdbgrxol.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_WKWwxJeXUi0bbgN4NsD3nQ_w1Xwdjhs";
        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Admin Emails lachuun qofa hayyamaman
        const ADMIN_EMAILS = [
            "seyfudin33@gmail.com",
            "suufiyaanjeeylaanofficial1@gmail.com"
        ];

        async function loginAdminWithGoogle() {
            await db.auth.signInWithOAuth({
                provider: 'google',
                options: { redirectTo: window.location.href }
            });
        }

        window.addEventListener('DOMContentLoaded', async () => {
            const { data: { user } } = await db.auth.getUser();
            if (user) {
                const userEmail = user.email.toLowerCase();
                if (ADMIN_EMAILS.includes(userEmail)) {
                    document.getElementById('admin-auth').classList.add('hidden');
                    document.getElementById('admin-main').classList.remove('hidden');
                    document.getElementById('admin-name').textContent = user.user_metadata?.full_name || "Admin";
                    document.getElementById('admin-email').textContent = user.email;
                    if(user.user_metadata?.avatar_url) document.getElementById('admin-avatar').src = user.user_metadata.avatar_url;
                    loadAllData();
                } else {
                    alert("Dhiifama! Google Account kun Admin miti.");
                    await db.auth.signOut();
                }
            }
        });

        function loadAllData() {
            loadExamsForSelect();
            loadAdminExamsList();
            loadAdminResults();
            loadAdminStudents();
            loadFeedbacks();
        }

        async function createExam() {
            const title = document.getElementById('new-exam-title').value.trim();
            const duration = document.getElementById('new-exam-duration').value;
            if (!title || !duration) return alert("Mata-duree fi yeroo guuti!");

            const { error } = await db.from('exam_tests').insert([{ title, duration_minutes: parseInt(duration) }]);
            if (error) return alert("Error: " + error.message);

            alert("🎉 Qormaanni Uumameera!");
            document.getElementById('new-exam-title').value = '';
            document.getElementById('new-exam-duration').value = '';
            loadAllData();
        }

        async function loadExamsForSelect() {
            const sel = document.getElementById('bulk-exam-select');
            const { data } = await db.from('exam_tests').select('*');
            if (data && data.length > 0) {
                sel.innerHTML = data.map(e => `<option value="${e.id}">${e.title}</option>`).join('');
            } else {
                sel.innerHTML = '<option value="">Qormaata uumi</option>';
            }
        }

        async function loadAdminExamsList() {
            const cont = document.getElementById('exams-admin-list');
            const { data } = await db.from('exam_tests').select('*').order('created_at', { ascending: false });
            if (data && data.length > 0) {
                cont.innerHTML = data.map(e => `
                    <div class="flex items-center justify-between p-3 border border-slate-100 rounded-2xl bg-slate-50 text-xs">
                        <div>
                            <p class="font-bold text-slate-900">${e.title}</p>
                            <span class="text-[10px] text-slate-400">${e.duration_minutes} Mins</span>
                        </div>
                        <div class="flex gap-2">
                            <button onclick="viewQuestions('${e.id}', '${encodeURIComponent(e.title)}')" class="bg-indigo-50 text-[#1565C0] px-3 py-1.5 rounded-xl font-bold">Ilaali</button>
                            <button onclick="deleteExam('${e.id}')" class="bg-rose-50 text-rose-600 px-3 py-1.5 rounded-xl font-bold">Haqi</button>
                        </div>
                    </div>
                `).join('');
            } else {
                cont.innerHTML = `<p class="text-slate-400 text-xs text-center py-4">Qormaanni hin jiru.</p>`;
            }
        }

        async function deleteExam(id) {
            if (confirm("Qormaata kana haquu feetaa?")) {
                await db.from('exam_tests').delete().eq('id', id);
                loadAllData();
            }
        }

        async function viewQuestions(examId, titleEnc) {
            const title = decodeURIComponent(titleEnc);
            document.getElementById('modal-exam-title').textContent = "Gaaffilee: " + title;
            document.getElementById('questions-modal').classList.remove('hidden');

            const { data } = await db.from('exam_questions').select('*').eq('exam_id', examId);
            const list = document.getElementById('modal-questions-list');

            if (data && data.length > 0) {
                list.innerHTML = data.map((q, i) => `
                    <div class="p-3 border rounded-2xl bg-slate-50 text-xs space-y-1">
                        <div class="flex justify-between font-bold text-slate-900">
                            <span>${i+1}. ${q.question_text}</span>
                            <button onclick="deleteQuestion('${q.id}', '${examId}', '${titleEnc}')" class="text-rose-500"><i class="fa-solid fa-trash"></i></button>
                        </div>
                        <p class="text-slate-500">A) ${q.option_a} | B) ${q.option_b} | C) ${q.option_c} | D) ${q.option_d}</p>
                        <p class="font-bold text-[#2e7d32]">Deebii: ${q.correct_option}</p>
                    </div>
                `).join('');
            } else {
                list.innerHTML = `<p class="text-slate-400 text-xs text-center py-4">Gaaffiin hin galmoofne.</p>`;
            }
        }

        async function deleteQuestion(qId, examId, titleEnc) {
            await db.from('exam_questions').delete().eq('id', qId);
            viewQuestions(examId, titleEnc);
        }

        function closeModal() {
            document.getElementById('questions-modal').classList.add('hidden');
        }

        async function parseAndSaveBulkQuestions() {
            const examId = document.getElementById('bulk-exam-select').value;
            const rawText = document.getElementById('bulk-text').value.trim();

            if (!examId) return alert("Dura qormaata filadhu!");
            if (!rawText) return alert("Gaaffilee galchi!");

            const lines = rawText.split('\n').map(l => l.trim()).filter(l => l.length > 0);
            const questions = [];
            let currentQ = null;

            for (let line of lines) {
                const isNewQ = /^\d+[\.\)]\s/.test(line) || /^Gaaffii\s*\d+/i.test(line);

                if (isNewQ) {
                    if (currentQ) questions.push(currentQ);
                    currentQ = {
                        exam_id: examId,
                        question_text: line.replace(/^\d+[\.\)]\s*/, '').replace(/^Gaaffii\s*\d+[\:\.\)]\s*/i, '').trim(),
                        option_a: '', option_b: '', option_c: '', option_d: '',
                        correct_option: 'A'
                    };
                } else if (currentQ) {
                    if (/^[Aa][\.\)]/.test(line)) currentQ.option_a = line.replace(/^[Aa][\.\)]\s*/, '').trim();
                    else if (/^[Bb][\.\)]/.test(line)) currentQ.option_b = line.replace(/^[Bb][\.\)]\s*/, '').trim();
                    else if (/^[Cc][\.\)]/.test(line)) currentQ.option_c = line.replace(/^[Cc][\.\)]\s*/, '').trim();
                    else if (/^[Dd][\.\)]/.test(line)) currentQ.option_d = line.replace(/^[Dd][\.\)]\s*/, '').trim();
                    else if (/deebii|ans|correct/i.test(line)) {
                        const m = line.match(/[A-D]/i);
                        if (m) currentQ.correct_option = m[0].toUpperCase();
                    }
                }
            }
            if (currentQ) questions.push(currentQ);

            if (questions.length === 0) return alert("Gaaffiin tokko illee sirriitti adda hin baane.");

            const { error } = await db.from('exam_questions').insert(questions);
            if (error) return alert("Error: " + error.message);

            alert(`🎉 Gaaffileen ${questions.length} galmeeffamaniiru!`);
            document.getElementById('bulk-text').value = '';
            loadAllData();
        }

        async function postNotice() {
            const title = document.getElementById('notice-title').value.trim();
            const msg = document.getElementById('notice-msg').value.trim();
            if (!title || !msg) return alert("Guuti!");

            await db.from('exam_notices').insert([{ title, message: msg }]);
            alert("🎉 Beeksisni Maxxanfameera!");
            document.getElementById('notice-title').value = '';
            document.getElementById('notice-msg').value = '';
        }

        async function loadAdminResults() {
            const cont = document.getElementById('results-table');
            const { data } = await db.from('exam_results').select('*, exam_tests(title)').order('score', { ascending: false });
            if (data && data.length > 0) {
                cont.innerHTML = data.map((r, i) => `
                    <div class="flex items-center justify-between p-3 border border-slate-100 rounded-2xl bg-slate-50 text-xs">
                        <div class="flex items-center gap-2">
                            <span class="w-5 h-5 rounded-full flex items-center justify-center font-bold text-[10px] ${i === 0 ? 'bg-amber-400 text-slate-900' : 'bg-slate-200 text-slate-600'}">${i+1}</span>
                            <div>
                                <p class="font-bold text-slate-900">${r.student_name} <span class="text-[10px] text-slate-400">(${r.student_id})</span></p>
                                <span class="text-[10px] text-slate-400">${r.exam_tests?.title || 'Exam'}</span>
                            </div>
                        </div>
                        <span class="font-black text-[#2e7d32] text-xs">${r.score.toFixed(1)}%</span>
                    </div>
                `).join('');
            } else {
                cont.innerHTML = `<p class="text-slate-400 text-xs text-center py-4">Qabxiin hin jiru.</p>`;
            }
        }

        async function loadAdminStudents() {
            const cont = document.getElementById('students-table');
            const { data } = await db.from('exam_students').select('*').order('created_at', { ascending: false });
            if (data && data.length > 0) {
                cont.innerHTML = data.map(s => `
                    <div class="flex items-center justify-between p-3 border border-slate-100 rounded-2xl bg-slate-50 text-xs">
                        <div>
                            <p class="font-bold text-slate-900">${s.full_name}</p>
                            <span class="text-[10px] text-slate-400">${s.phone}</span>
                        </div>
                        <button onclick="toggleStudent('${s.id}', ${!s.is_allowed})" class="px-3 py-1 rounded-xl font-bold ${s.is_allowed ? 'bg-rose-50 text-rose-600' : 'bg-emerald-50 text-[#2e7d32]'}">
                            ${s.is_allowed ? 'Dhowwi' : 'Hayyami'}
                        </button>
                    </div>
                `).join('');
            } else {
                cont.innerHTML = `<p class="text-slate-400 text-xs text-center py-4">Barataan hin galmoofne.</p>`;
            }
        }

        async function loadFeedbacks() {
            const cont = document.getElementById('feedbacks-table');
            const { data } = await db.from('exam_feedbacks').select('*').order('created_at', { ascending: false });
            if (data && data.length > 0) {
                cont.innerHTML = data.map(f => `
                    <div class="p-3 border border-slate-100 rounded-2xl bg-slate-50 text-xs space-y-1">
                        <p class="font-bold text-slate-900">${f.student_name} <span class="text-slate-400 font-mono">(${f.student_id})</span></p>
                        <p class="text-slate-600">${f.message}</p>
                    </div>
                `).join('');
            } else {
                cont.innerHTML = `<p class="text-slate-400 text-xs text-center py-4">Yaadni hin jiru.</p>`;
            }
        }

        async function toggleStudent(id, status) {
            await db.from('exam_students').update({ is_allowed: status }).eq('id', id);
            loadAdminStudents();
        }

        async function logoutAdmin() {
            await db.auth.signOut();
            window.location.reload();
        }
    </script>
</body>
</html>
