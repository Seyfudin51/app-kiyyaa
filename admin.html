<!DOCTYPE html>
<html lang="om">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Exam Control Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen">

    <!-- ADMIN PIN LOGIN -->
    <div id="admin-auth" class="min-h-screen flex items-center justify-center px-4">
        <div class="max-w-sm w-full bg-white p-8 rounded-3xl shadow-xl border text-center space-y-4">
            <div class="w-14 h-14 bg-slate-900 text-white rounded-2xl flex items-center justify-center mx-auto text-xl"><i class="fa-solid fa-lock"></i></div>
            <h2 class="text-xl font-bold text-slate-900">Seensa Admin</h2>
            <input type="password" id="admin-pin" placeholder="Admin PIN (1234)" class="w-full px-4 py-3 border-2 rounded-xl text-center font-bold tracking-widest outline-none">
            <button type="button" id="btn-admin-enter" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-3 rounded-xl transition cursor-pointer">Bani (Enter)</button>
        </div>
    </div>

    <!-- MAIN ADMIN DASHBOARD -->
    <div id="admin-main" class="hidden min-h-screen flex flex-col">
        <header class="bg-slate-900 text-white h-16 flex items-center justify-between px-6">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-shield-halved text-amber-400 text-xl"></i>
                <span class="font-bold">Admin Exam Portal</span>
            </div>
            <a href="/" class="text-xs bg-slate-800 hover:bg-slate-700 px-3 py-2 rounded-lg font-bold">Gara Fuula Barataatti</a>
        </header>

        <main class="max-w-7xl w-full mx-auto p-6 grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <!-- LEFT: CREATE EXAM & BULK QUESTIONS -->
            <div class="space-y-6">
                <!-- Create Exam -->
                <div class="bg-white p-6 rounded-2xl border shadow-sm space-y-3">
                    <h3 class="font-bold text-slate-900 text-sm flex items-center gap-2"><i class="fa-solid fa-folder-plus text-indigo-600"></i> Qormaata Haaraa Uumi</h3>
                    <input type="text" id="new-exam-title" placeholder="Mata-duree (fkn: Qormaata Kutaa 4ffaa)" class="w-full px-3 py-2 border rounded-xl text-sm">
                    <input type="number" id="new-exam-duration" placeholder="Yeroo (Daqiiqaa - fkn: 30)" class="w-full px-3 py-2 border rounded-xl text-sm">
                    <button type="button" id="btn-create-exam" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 rounded-xl text-sm transition cursor-pointer">Uumi (Create)</button>
                </div>

                <!-- BULK QUESTIONS PARSER -->
                <div class="bg-white p-6 rounded-2xl border shadow-sm space-y-3">
                    <h3 class="font-bold text-slate-900 text-sm flex items-center gap-2"><i class="fa-solid fa-paste text-emerald-600"></i> Gaaffilee 50 Al-tokkotti Galchi (Bulk Paste)</h3>
                    <select id="bulk-exam-select" class="w-full px-3 py-2 border rounded-xl text-sm bg-white font-bold"></select>
                    <p class="text-[11px] text-slate-400">Format: Gaaffii, A), B), C), D), fi Deebii: A/B/C/D saanduuqa kanaan paste godhi.</p>
                    <textarea id="bulk-text" rows="8" placeholder="Fakkeenya:
1. AI jechuun maali?
A) Artificial Intelligence
B) Apple Internet
C) Android Info
D) Auto Image
Deebii: A

2. Gaaffii lammaffaa...
A) ...
B) ...
C) ...
D) ...
Deebii: B" class="w-full p-3 border rounded-xl text-xs font-mono"></textarea>
                    <button type="button" id="btn-save-bulk" class="w-full bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 text-white font-bold py-2.5 rounded-xl text-sm transition cursor-pointer">Parse & Save Hundaa</button>
                </div>
            </div>

            <!-- RIGHT: RESULTS, RANKINGS & STUDENTS -->
            <div class="lg:col-span-2 space-y-6">
                <!-- Leaderboard & Results -->
                <div class="bg-white p-6 rounded-2xl border shadow-sm space-y-4">
                    <h3 class="font-bold text-slate-900 text-base flex items-center gap-2"><i class="fa-solid fa-trophy text-amber-500"></i> Qabxii & Sadarkaa Barattootaa (Rankings)</h3>
                    <div id="results-table" class="space-y-2 max-h-72 overflow-y-auto"></div>
                </div>

                <!-- Manage Students (Permission) -->
                <div class="bg-white p-6 rounded-2xl border shadow-sm space-y-4">
                    <h3 class="font-bold text-slate-900 text-base flex items-center gap-2"><i class="fa-solid fa-users text-blue-600"></i> Barattoota Bulchuu (Allow / Block)</h3>
                    <div id="students-table" class="space-y-2 max-h-72 overflow-y-auto"></div>
                </div>
            </div>

        </main>
    </div>

    <script>
        const SUPABASE_URL = "https://zxljzdhuilhzcdbgrxol.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_WKWwxJeXUi0bbgN4NsD3nQ_w1Xwdjhs";
        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        document.getElementById('btn-admin-enter').addEventListener('click', () => {
            const pin = document.getElementById('admin-pin').value.trim();
            if (pin === "1234") {
                document.getElementById('admin-auth').classList.add('hidden');
                document.getElementById('admin-main').classList.remove('hidden');
                loadExamsForSelect();
                loadAdminResults();
                loadAdminStudents();
            } else {
                alert("PIN Dogoggora! (PIN sirriin 1234)");
            }
        });

        document.getElementById('btn-create-exam').addEventListener('click', async () => {
            const title = document.getElementById('new-exam-title').value.trim();
            const duration = document.getElementById('new-exam-duration').value;
            if (!title || !duration) return alert("Maaloo mata-duree fi yeroo guuti!");
            const { error } = await db.from('exam_tests').insert([{ title, duration_minutes: parseInt(duration) }]);
            if (error) return alert("Error: " + error.message);
            alert("Qormaanni uumameera!");
            document.getElementById('new-exam-title').value = '';
            document.getElementById('new-exam-duration').value = '';
            loadExamsForSelect();
        });

        async function loadExamsForSelect() {
            const sel = document.getElementById('bulk-exam-select');
            const { data: exams } = await db.from('exam_tests').select('*');
            if (exams && exams.length > 0) {
                sel.innerHTML = exams.map(e => `<option value="${e.id}">${e.title}</option>`).join('');
            } else {
                sel.innerHTML = '<option value="">Dura qormaata uumi</option>';
            }
        }

        document.getElementById('btn-save-bulk').addEventListener('click', async () => {
            const examId = document.getElementById('bulk-exam-select').value;
            const raw = document.getElementById('bulk-text').value.trim();
            if (!examId || !raw) return alert("Maaloo qormaata filadhuuti text gaaffilee galchi!");

            const blocks = raw.split(/\n\s*\n/);
            const parsedQuestions = [];

            for (const block of blocks) {
                const lines = block.split('\n').map(l => l.trim()).filter(l => l.length > 0);
                if (lines.length >= 5) {
                    let qText = lines[0].replace(/^\d+[\.\)]\s*/, '');
                    let optA = '', optB = '', optC = '', optD = '', ans = 'A';

                    for (const line of lines.slice(1)) {
                        if (/^[Aa][\.\)]\s*/.test(line)) optA = line.replace(/^[Aa][\.\)]\s*/, '');
                        else if (/^[Bb][\.\)]\s*/.test(line)) optB = line.replace(/^[Bb][\.\)]\s*/, '');
                        else if (/^[Cc][\.\)]\s*/.test(line)) optC = line.replace(/^[Cc][\.\)]\s*/, '');
                        else if (/^[Dd][\.\)]\s*/.test(line)) optD = line.replace(/^[Dd][\.\)]\s*/, '');
                        else if (/^(Deebii|Answer|Ans):\s*/i.test(line)) {
                            ans = line.replace(/^(Deebii|Answer|Ans):\s*/i, '').trim().toUpperCase().charAt(0);
                        }
                    }

                    if (qText && optA && optB) {
                        parsedQuestions.push({
                            exam_id: examId,
                            question_text: qText,
                            option_a: optA || '-',
                            option_b: optB || '-',
                            option_c: optC || '-',
                            option_d: optD || '-',
                            correct_option: ans
                        });
                    }
                }
            }

            if (parsedQuestions.length === 0) {
                return alert("Gaaffileen format sirriin adda ba'uu hin dandeenye. Maaloo format fakkeenyaa hordofi.");
            }

            const { error } = await db.from('exam_questions').insert(parsedQuestions);
            if (error) return alert("Error: " + error.message);

            alert("🎉 Gaaffileen " + parsedQuestions.length + " milkaa'inaan kuufamaniiru!");
            document.getElementById('bulk-text').value = '';
        });

        async function loadAdminResults() {
            const cont = document.getElementById('results-table');
            const { data: res } = await db.from('exam_results').select('*, exam_tests(title)').order('score', { ascending: false });
            if (res && res.length > 0) {
                cont.innerHTML = res.map((r, i) => `
                    <div class="flex items-center justify-between p-3 border rounded-xl bg-slate-50 text-sm">
                        <div class="flex items-center gap-3">
                            <span class="w-6 h-6 rounded-full flex items-center justify-center font-bold text-xs ${i === 0 ? 'bg-amber-400 text-slate-900' : (i === 1 ? 'bg-slate-300 text-slate-900' : 'bg-slate-200 text-slate-600')}">${i+1}</span>
                            <div>
                                <p class="font-bold text-slate-900">${r.student_name} <span class="text-[10px] text-slate-400 font-mono">(${r.student_id})</span></p>
                                <span class="text-[11px] text-slate-500">${r.exam_tests?.title || 'Exam'}</span>
                            </div>
                        </div>
                        <span class="font-bold text-emerald-600">${r.score.toFixed(1)}% (${r.correct_answers}/${r.total_questions})</span>
                    </div>
                `).join('');
            } else {
                cont.innerHTML = `<p class="text-slate-400 text-xs">Qabxiin hin jiru.</p>`;
            }
        }

        async function loadAdminStudents() {
            const cont = document.getElementById('students-table');
            const { data: students } = await db.from('exam_students').select('*').order('created_at', { ascending: false });
            if (students && students.length > 0) {
                cont.innerHTML = students.map(s => `
                    <div class="flex items-center justify-between p-3 border rounded-xl bg-slate-50 text-sm">
                        <div>
                            <p class="font-bold text-slate-900">${s.full_name} <span class="text-indigo-600 font-mono text-xs">(${s.id})</span></p>
                            <span class="text-xs text-slate-500"><i class="fa-solid fa-phone text-[10px]"></i> ${s.phone}</span>
                        </div>
                        <button onclick="toggleStudentPermission('${s.id}', ${!s.is_allowed})" class="px-3 py-1 rounded-lg text-xs font-bold cursor-pointer ${s.is_allowed ? 'bg-rose-50 text-rose-600 border border-rose-200' : 'bg-emerald-50 text-emerald-600 border border-emerald-200'}">
                            ${s.is_allowed ? 'Dhowwi (Block)' : 'Hayyami (Allow)'}
                        </button>
                    </div>
                `).join('');
            } else {
                cont.innerHTML = `<p class="text-slate-400 text-xs">Barataan hin galmoofne.</p>`;
            }
        }

        window.toggleStudentPermission = async function(id, newStatus) {
            await db.from('exam_students').update({ is_allowed: newStatus }).eq('id', id);
            loadAdminStudents();
        };
    </script>
</body>
</html>
